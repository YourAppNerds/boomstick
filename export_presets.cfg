[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="build/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"Boomstick: a small Doom-like shooter made with Godot 4 C# for the web.\">
<meta name=\"theme-color\" content=\"#000000\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<style>
html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { touch-action: none; }
</style>
<script>
(function () {
  // No page scrolling, pinch zoom, double-tap zoom or long-press menu while playing.
  var stop = function (e) { e.preventDefault(); };
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop);
  // Go fullscreen and landscape on the first tap (needs a user gesture; ignored where unsupported).
  var tried = false;
  document.addEventListener('touchend', function () {
    if (tried) return;
    tried = true;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || document.fullscreenElement) return;
    try {
      var p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) {
        p.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      }
    } catch (err) {}
  }, { passive: true });
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=true
